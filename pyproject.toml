[project]
name = "pong"
version = "0.1.0"
description = "A PyTorch reimplementation of Karpathy's Deep RL Pong from Pixels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ale-py>=0.10.2",
    "gymnasium>=1.0.0",
    "matplotlib>=3.10.0",
    "numpy>=1.26.0",
    "opencv-python>=4.10.0",
    "torch>=2.6.0",
]
